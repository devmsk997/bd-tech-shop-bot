name: BD TECH SHOP REVIEW

on:
  schedule:
    - cron: '23 3 * * *'    # Bangladesh Time 9:23 AM (UTC 03:23)
    - cron: '41 7 * * *'    # Bangladesh Time 1:41 PM (UTC 07:41)
    - cron: '12 11 * * *'   # Bangladesh Time 5:12 PM (UTC 11:12)
    - cron: '37 15 * * *'   # Bangladesh Time 9:37 PM (UTC 15:37)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python main.py

      - name: Commit and push updated JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add blog_posts.json posted_topics.json || true
          git commit -m "Auto-update posted records [skip ci]" || true
          git push || true
