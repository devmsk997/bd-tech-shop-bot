name: BD Tech Shop Review Bot - Daily Posts

on:
  schedule:
    - cron: '17 3 * * *'  # বাংলাদেশ সময় সকাল ৯:১৭ (UTC 3:17 AM)
    - cron: '17 15 * * *' # বাংলাদেশ সময় রাত ৯:১৭ (UTC 3:17 PM)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
