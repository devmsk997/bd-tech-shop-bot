name: BD Tech Shop Review Bot - Daily Posts

on:
  schedule:
    - cron: '17 3 * * *'  # বাংলাদেশ সময় সকাল ৯:১৭ (UTC 3:17 AM)
    - cron: '17 15 * * *' # বাংলাদেশ সময় রাত ৯:১৭ (UTC 3:15 PM)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bd-tech-shop-daily-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOG_ID: ${{ secrets.BLOG_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build private runtime files
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Missing repository secret: GEMINI_API_KEY"
            exit 1
          fi
          if [ -z "${BLOG_ID:-}" ]; then
            echo "::error::Missing repository secret: BLOG_ID"
            exit 1
          fi
          if [ -z "${GOOGLE_CREDENTIALS_JSON:-}" ]; then
            echo "::error::Missing repository secret: GOOGLE_CREDENTIALS_JSON"
            exit 1
          fi
          if [ -z "${GOOGLE_TOKEN_JSON:-}" ]; then
            echo "::error::Missing repository secret: GOOGLE_TOKEN_JSON"
            exit 1
          fi

          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

      - name: Publish one blog post
        run: python main.py

      - name: Remove private runtime files
        if: always()
        shell: bash
        run: rm -f credentials.json token.json

      - name: Save bot state
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in posted_topics.json blog_posts.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No state changes to save."
            exit 0
          fi

          git commit -m "Update bot state [skip ci]"
          git push
