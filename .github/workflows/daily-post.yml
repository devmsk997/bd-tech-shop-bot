name: BD TECH SHOP REVIEW

on:
  schedule:
    - cron: '17 3 * * *'   # Bangladesh Time 9:17 AM (UTC 03:17)
    - cron: '17 7 * * *'   # Bangladesh Time 1:17 PM (UTC 07:17)
    - cron: '17 11 * * *'  # Bangladesh Time 5:17 PM (UTC 11:17)
    - cron: '17 15 * * *'  # Bangladesh Time 9:17 PM (UTC 15:17)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python main.py
