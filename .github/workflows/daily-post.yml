name: BD TECH SHOP REVIEW

on:
  schedule:
    - cron: '17 3 * * *'  # বাংলাদেশ সময় সকাল ৯:১৭ (UTC 03:17)
    - cron: '17 7 * * *'  # বাংলাদেশ সময় দুপুর ১:১৭ (UTC 07:17)
    - cron: '17 11 * * *' # বাংলাদেশ সময় বিকাল ৫:১৭ (UTC 11:17)
    - cron: '17 15 * * *' # বাংলাদেশ সময় রাত ৯:১৭ (UTC 15:17)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ১০ মিনিটের জায়গায় ২০ মিনিট করা হলো

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python main.py
